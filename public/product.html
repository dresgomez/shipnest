<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Producto</title>

  <!-- CSS -->
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="/css/product.css">
 <link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
/>

  <!-- JS (defer = carga sin bloquear) -->
  <script src="/js/cart.js" defer></script>
  <script src="/js/product.js" defer></script>
 
</head>

<body>


<header class="navbar">
    <div class="logo">Aigo</div>
   
    <a href="index.html" class="back-button">
  ← 
</a>

    <div class="header-icons">
        <a href="#" class="header-icon">
            <i class="fas fa-user"></i>
        </a>

        <a href="carrito.html" class="header-icon cart-link">
            <i class="fas fa-shopping-cart"></i>
            <span class="cart-count">0</span>
        </a>
    </div>
</header>

  <div class="product-container">

   <div class="product-gallery">

  <div class="thumbnail-list">

    <img class="thumb active-thumb" id="thumb-1">

    <img class="thumb" id="thumb-2">

    <img class="thumb" id="thumb-3">

  </div>

  <div class="main-image">
    <img id="product-image" src="" alt="">
  </div>

</div>

    <div class="product-info">
      <h1 id="product-name"></h1>

      <div class="product-meta">

  <p class="product-price" id="product-price"></p>

  <p class="product-stock" id="product-stock"></p>

</div>

<div class="product-actions">

  <button id="add-to-cart-btn">
    Add to cart
  </button>

</div>


      <div class="product-description">
        <h3>Descripción</h3>
        <p id="product-description"></p>
      </div>

    </div>

  </div>

  
      <section class="related-products">

  <h2>Similar Products</h2>

  <div id="related-products-container"></div>

</section>

</body>
</html>
