<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Carrito - Aigo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">Aigo</div>

        <nav>
            <a href="index.html">Home</a>
        </nav>

        <div class="header-icons">
            <a href="#" class="header-icon">
                <i class="fas fa-shopping-cart"></i>
            </a>
        </div>
    </header>

    <section class="cart-section">
        <h2>Your Cart</h2>

        <!-- Aquí se mostrará el carrito -->
        <div id="cart-container"></div>

        <!-- Total -->
        <div class="cart-total-box">
            <h3>Total:</h3>
            <p id="cart-total">$0.00</p>
        </div>

        <!-- Botón de pago -->
        <button class="pay-btn" id="pay-button">Proceed to Payment</button>
    </section>

    <script src="script.js"></script>
    <div id="paypal-button-container" style="margin-top: 30px;"></div>
<script src="https://www.paypal.com/sdk/js?client-id=AU9-K56hxaNf3NqtHv4iD16iW-jwrJSbB8O6OMV4u7LAKVxEu8L1HJy0AGODbdHGua_g4KH7v1qnfEhT&currency=BRL"></script>
<script>
paypal.Buttons({
  createOrder: async () => {
    const cart = JSON.parse(localStorage.getItem("cart")) || [];

    if (cart.length === 0) {
      throw new Error("Carrito vacío");
    }

    const res = await fetch("/api/checkout/create-paypal-order", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ items: cart })
    });

    const data = await res.json();

    if (!data.id) {
      throw new Error("No se pudo crear la orden");
    }

    return data.id;
  },

  onApprove: async (data) => {
    alert("Pago aprobado: " + data.orderID);
  },

  onError: (err) => {
    console.error("PayPal error:", err);
    alert("Error en el pago");
  }
}).render("#paypal-button-container");
</script>

</script>

</body>
</html>
