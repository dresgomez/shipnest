<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Carrito - Aigo</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/cart.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- JS base -->
<script src="/js/cart.js" defer></script>
<script src="/js/cart-actions.js" defer></script>
<script src="/js/auth.js" defer></script>
<script src="/js/script.js" defer></script>
<!-- <script src="/js/script.js" defer></script> -->
</head>
<body>

<header class="navbar">

<div class="header-top">

  <a href="index.html" class="logo">Aigo</a>

  <div class="header-icons">

    <a href="index.html" class="header-icon">
      <i class="fas fa-home"></i>
    </a>

  <a href="client.html" class="header-icon  user-link">
    <i class="fas fa-user"></i>
  </a>

    <a href="carrito.html" class="header-icon cart-link">
      <i class="fas fa-shopping-cart"></i>
      <span class="cart-count">0</span>
    </a>

  </div>

</header>

 <section class="cart-section">

    <h2>Your Cart</h2>

    <div class="cart-layout">

        <div class="cart-products">
            <div id="cart-container"></div>
        </div>

        <div class="cart-summary">

    <h3 class="summary-title">
        Order Summary
    </h3>

            <div class="cart-total-box">
                <h3>Total:</h3>
                <p id="cart-total">$0.00</p>
            </div>

            <button class="pay-btn" id="pay-button">
                Proceed to Payment
            </button>

        </div>

    </div>

</section>

    
    <div id="paypal-button-container" style="margin-top: 30px;"></div>
