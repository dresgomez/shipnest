<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Carrito - Aigo</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- JS base -->
  <script src="/js/cart.js" defer></script>
  <script src="/js/auth.js" defer></script>
  <script src="/js/script.js" defer></script>

  <!-- PayPal SDK (DEFER NO VA AQUÍ) -->
 <script src="https://www.paypal.com/sdk/js?client-id=AU9-K56hxaNf3NqtHv4iD16iW-jwrJSbB8O6OMV4u7LAKVxEu8L1HJy0AGODbdHGua_g4KH7v1qnfEhT&currency=BRL"></script>
 
 <script src="/js/cart.js" defer></script>
<script src="/js/cart-actions.js" defer></script>

</head>
<body>

    <header class="navbar">
        <div class="logo">Aigo</div>

        <nav>
            <a href="index.html">Home</a>
        </nav>

        <div class="header-icons">
            <a href="#" class="header-icon">
                <i class="fas fa-shopping-cart"></i>
            </a>
        </div>
    </header>

    <section class="cart-section">
        <h2>Your Cart</h2>

        <!-- Aquí se mostrará el carrito -->
        <div id="cart-container"></div>

        <!-- Total -->
        <div class="cart-total-box">
            <h3>Total:</h3>
            <p id="cart-total">$0.00</p>
        </div>

        <!-- Botón de pago -->
        <button class="pay-btn" id="pay-button">Proceed to Payment</button>
    </section>

    
    <div id="paypal-button-container" style="margin-top: 30px;"></div>
<script src="https://www.paypal.com/sdk/js?client-id=AU9-K56hxaNf3NqtHv4iD16iW-jwrJSbB8O6OMV4u7LAKVxEu8L1HJy0AGODbdHGua_g4KH7v1qnfEhT&currency=BRL">
</script>
</body>
</html>
