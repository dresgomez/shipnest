<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout - Aigo</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- JS base -->
  <script src="/js/cart.js" defer></script>
  <script src="/js/auth.js" defer></script>
  <script src="/js/checkout.js" defer></script>
</head>
<body>

<header class="checkout-header">

  <a href="index.html" class="logo">
    Aigo
  </a>

  <a href="carrito.html" class="back-to-cart">
    <i class="fas fa-arrow-left"></i>
    Back to Cart
  </a>

</header>

<section class="checkout-section">
  <div class="checkout-wrapper">

  <h2>Checkout</h2>

  <!-- Productos seleccionados -->
  <div id="checkout-items"></div>

  <!-- Total -->
  <div class="checkout-total">
    <h3>Total:</h3>
    <p id="checkout-total">$0.00</p>
  </div>

<div id="paypal-button-container" style="margin-top: 20px;"></div>
<div id="payment-status" style="margin-top:12px;"></div>

  </div>
</section>

<script src="https://www.paypal.com/sdk/js?client-id=AU9-K56hxaNf3NqtHv4iD16iW-jwrJSbB8O6OMV4u7LAKVxEu8L1HJy0AGODbdHGua_g4KH7v1qnfEhT&currency=BRL"></script>

</body>
</html>
